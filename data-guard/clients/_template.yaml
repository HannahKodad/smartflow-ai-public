# data-guard client profile template. Copy to ~/.claude/data-guard/clients/<client>.yaml
client: client-name            # lowercase, digits, hyphens; must match the file name
display_name: "Client Name"
client_number: "003"           # three digits; prefixes admin folders (003_to-delete)
protection_level: gdpr         # standard | gdpr | gdpr-strict
allowed_domains:               # sharing allowed only inside these domains
  - client.com
owners:                        # protected-branch owners besides you
  - owner@client.com
operator: you@example.com   # logged as actor
allowed_tools:                 # whitelist on gdpr/gdpr-strict (tool name, suffix, or family)
  - search_files
  - read_file_content
  - get_file_metadata
  - create_file
  - update_file
protected_folders:
  - name: "003_main"
    drive_id: ""
admin_folders:
  to-delete: 003_to-delete
  to-processing: 003_to-processing
  to-check: 003_to-check
log:
  sheet_name: 003_admin-log
  drive_folder_id: ""
  inbox_folder_id: ""
  local_dir: ""                # default ~/.claude/data-guard/logs
batch_size: 5
sensitive_terms: []
purposes:
  - "data migration"
